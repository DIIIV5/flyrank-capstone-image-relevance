# Labels, folder paths, and score thresholds. Secrets go in .env.
# Restart the worker after editing this file.
# After changing labels or score_scale, run: npm run reset-embed-images && npm run ingest

labels: [fox, wolf, dog, cat, tiger, bear, deer, cow, chicken, other]
catch_all: other

# raw stores the image-text CLIP dot product; softmax stores softmax over those dots.
score_scale: raw
softmax_temperature: 1

# An image is "processed" when score >= label_score_min and (score - runner_up) >= label_margin_min,
# otherwise "flagged". Pick these from the grids that `npm run eval-labels` prints.
label_score_min: 0.25
label_margin_min: 0.01

# The guard refuses a pair whose cosine similarity is below cosine_min,
# and (when check_flagged is true) any image that fails the rule above.
cosine_min: 0.25
check_flagged: true

# Optional. The default prompt is "a photo of a {label}"; the catch-all uses "a photo of an animal".
# label_prompts:
#   fox: a photo of a red fox

paths:
  corpus: data/images
  posts: data/posts
  matching_gold: data/eval/labels.json
  label_eval:
    fox: data/images/eval/fox
    wolf: data/images/eval/wolf
    dog: data/images/eval/dog
    cat: data/images/eval/cat
    tiger: data/images/eval/tiger
    bear: data/images/eval/bear
    deer: data/images/eval/deer
    cow: data/images/eval/cow
    chicken: data/images/eval/chicken
    other: data/images/eval/other
