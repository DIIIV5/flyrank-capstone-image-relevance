# Submission manifest. The worker must be running, and ingest and annotate must have finished,
# before seed and run are useful.

run: npm run serve
seed: npm run seed-posts
test: npm test
base_url: http://localhost:3000

routes:
  - GET /posts/:id/images
  - POST /posts/:id/images
  - GET /suggestions/:id
  - POST /suggestions/:id/review
